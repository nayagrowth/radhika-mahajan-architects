<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="livelySunsetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E63" />
      <stop offset="50%" stop-color="#FF7E29" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#700010" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Vibrant Tri-Gradient Base -->
  <rect width="512" height="512" rx="110" fill="url(#livelySunsetGrad)" stroke="#FFFFFF" stroke-width="8" stroke-opacity="0.85" />
  
  <!-- Architectural Guideline Frame -->
  <rect x="22" y="22" width="468" height="468" rx="90" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.32" />
  
  <!-- Drafting Compass Circle & Crosshairs -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.25" />
  <line x1="60" y1="256" x2="452" y2="256" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="6 6" />
  <line x1="256" y1="60" x2="256" y2="452" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="6 6" />
  
  <!-- Pure Brilliant White RM Monogram -->
  <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="240" font-weight="600" fill="#FFFFFF" letter-spacing="-0.04em" filter="url(#softShadow)">RM</text>
  
  <!-- Architects Subtitle -->
  <text x="50%" y="82%" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="0.32em" opacity="0.95">ARCHITECTS</text>
</svg>